[package]
name = "codex-keysmith-gui"
version = "0.1.0"
description = "Visual client for codex-keysmith"
edition = "2021"

[lib]
name = "codex_keysmith_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "macros"] }
tauri-plugin-dialog = "2.7.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
