<!doctype html>
<html lang="zh-CN">

    <link rel="stylesheet" href="/src/styles.css" />

          </span>
        </div>

        <div id="view-manage" class="view hidden" role="tabpanel"></div>
        <div id="view-settings" class="view hidden" role="tabpanel"></div>
      </main>

    <script type="module" src="/src/main.js"></script>

</html>
